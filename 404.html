<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Page not found — Ibrahim Shaheen">
    <meta name="robots" content="noindex">
    <link rel="icon" href="favicon.ico" sizes="any">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <!-- Pre-paint setup: text direction from the saved language, and the saved
         starfield preference. Both before the browser draws anything. -->
    <script>
    (function(){
        var d=document.documentElement;
        var l=localStorage.getItem("lang")==="ar"?"ar":"en";
        d.setAttribute("lang",l);
        d.setAttribute("dir",l==="ar"?"rtl":"ltr");
        if(localStorage.getItem("starfield")==="off")d.classList.add("no-starfield");
    })();
    </script>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="i18n.js" defer></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron&family=Chakra+Petch:wght@400;500;700&display=swap" rel="preload" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <noscript><link href="https://fonts.googleapis.com/css2?family=Orbitron&family=Chakra+Petch:wght@400;500;700&display=swap" rel="stylesheet"></noscript>
    <title>Page not found — Ibrahim Shaheen</title>
</head>
<body>
    <!-- CSS-based galaxy background elements -->
    <div class="nebula nebula-1"></div>
    <div class="nebula nebula-2"></div>
    <div class="nebula nebula-3"></div>
    <div class="stars-medium"></div>
    <div class="stars-large"></div>
    <div class="bright-star bright-star-1"></div>
    <div class="bright-star bright-star-3"></div>
    <div class="bright-star bright-star-5"></div>

    <button id="starfield-toggle" class="starfield-toggle" aria-pressed="true" aria-label="Turn off the starfield">✦</button>

    <header><h1>Ibra</h1></header>

    <div class="notfound-container">
        <div class="notfound-code" aria-hidden="true">404</div>
        <h2 class="notfound-heading" data-ar="الصفحة غير موجودة">Page not found</h2>
        <p class="notfound-text" data-ar="الرابط الذي فتحته لم يعد موجودًا أو لم يكن صحيحًا. لنعد بك إلى الصفحة الرئيسية.">
            The link you followed is no longer here, or was never quite right. Let's get you back.
        </p>
        <div class="cta-buttons">
            <a href="/" class="cta-button" data-ar="العودة إلى الرئيسية">Back to Home</a>
        </div>
    </div>
</body>
</html>
