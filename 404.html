    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <!-- Pre-paint setup, before the browser draws anything: language/direction and
         the backdrop preference, from ?lang=/?backdrop= if present, else storage. -->
    <script>
    (function(){
        var d=document.documentElement,q=new URLSearchParams(location.search),S=null;
        try{S=localStorage}catch(e){}
        // ?lang= wins over the stored preference, and is then remembered,
        // so a shared Arabic link keeps working as the visitor browses on.
        var lp=q.get("lang");
        var lang=((lp!==null?lp:(S&&S.getItem("lang")))==="ar")?"ar":"en";
        if(lp!==null&&S){try{S.setItem("lang",lang)}catch(e){}}
        d.setAttribute("lang",lang);
        d.setAttribute("dir",lang==="ar"?"rtl":"ltr");
        // ?backdrop=off|on, same precedence. ?stars= is what this was called
        // before the backdrop stopped being a starfield; still read so links
        // shared earlier keep working. Safe to drop once none are in use.
        var bp=q.get("backdrop");if(bp===null)bp=q.get("stars");
        var bs=S&&(S.getItem("backdrop")||S.getItem("starfield"));
        var bg=bp!==null?(bp==="off"?"off":"on"):(bs==="off"?"off":"on");
        if(bp!==null&&S){try{S.setItem("backdrop",bg)}catch(e){}}
        if(bg==="off")d.classList.add("no-backdrop");
    })();
    </script>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="i18n.js" defer></script>
    <script src="circuit-bg.js" defer></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron&family=Chakra+Petch:wght@400;500;700&display=swap" rel="preload" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <noscript><link href="https://fonts.googleapis.com/css2?family=Orbitron&family=Chakra+Petch:wght@400;500;700&display=swap" rel="stylesheet"></noscript>
    <title>Page not found — Ibrahim Shaheen</title>
</head>

            </g>
            <g fill="currentColor">

                <rect x="10" y="17.75" width="4" height="4" />
